    <g filter="url(#lineBloomWide)" fill="url(#shieldBloom)" opacity="0.9">
      <path id="shield-left-bloom-wide" d="M110 656V359Q111 268 145.5 191.0Q180 114 250 46Q293 3 327.5 -21.0Q362 -45 412 -70L453 -89V11Q401 37 369.0 59.5Q337 82 313 107Q255 168 226.5 230.5Q198 293 198 365V630Q198 643 203.5 650.5Q209 658 223 663L453 755V849L187 744Q153 731 131.5 708.5Q110 686 110 656Z"/>
      <path id="shield-right-bloom-wide" d="M547 755 777 663Q790 658 796.0 651.0Q802 644 803 630V365Q802 293 773.5 230.5Q745 168 687 107Q664 83 631.5 60.5Q599 38 547 11V-89Q637 -41 679.5 -13.0Q722 15 751 46Q819 117 854.5 193.5Q890 270 891 359V651Q891 686 870.5 708.0Q850 730 814 744L547 849Z"/>
