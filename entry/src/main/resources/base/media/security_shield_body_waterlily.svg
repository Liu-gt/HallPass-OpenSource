      <path id="shield-right-bloom" d="M547 755 777 663Q790 658 796.0 651.0Q802 644 803 630V365Q802 293 773.5 230.5Q745 168 687 107Q664 83 631.5 60.5Q599 38 547 11V-89Q637 -41 679.5 -13.0Q722 15 751 46Q819 117 854.5 193.5Q890 270 891 359V651Q891 686 870.5 708.0Q850 730 814 744L547 849Z"/>
    </g>
