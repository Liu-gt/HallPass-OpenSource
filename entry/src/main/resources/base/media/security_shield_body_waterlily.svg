<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1240" width="1240" height="1240">
  <!-- HarmonyOS Symbol "security_shield" 字形导出（HMSymbolVF.ttf），1em = 1000 单位 -->
  <!-- 玻璃盾：剪影淡填充（内部浅渐变）+ 双层强泛光（近线 σ14 + 外扩 σ30）+ 清晰线条 -->
  <!-- 浅色：#3E7F7A 45%/60% 混入白（融化态 12%/22%）；画布外扩 120/边给泛光留余量，组件按 1240/1000 倍尺寸放置 -->
  <defs>
    <linearGradient id="shieldGlass" x1="0" y1="1000" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:rgb(168,197,195);stop-opacity:0.901961" />
      <stop offset="100%" style="stop-color:rgb(139,178,175);stop-opacity:0.301961" />
    </linearGradient>
    <linearGradient id="shieldBloom" x1="0" y1="1000" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:rgb(168,197,195);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(139,178,175);stop-opacity:0.55" />
    </linearGradient>
    <radialGradient id="shieldInterior" cx="500" cy="380" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:rgb(235,242,242);stop-opacity:0.06" />
      <stop offset="70%" style="stop-color:rgb(235,242,242);stop-opacity:0.16" />
      <stop offset="100%" style="stop-color:rgb(235,242,242);stop-opacity:0.32" />
    </radialGradient>
    <filter id="lineBloomWide" x="-20%" y="-18%" width="240%" height="236%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <filter id="lineBloom" x="-13%" y="-12%" width="226%" height="224%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>
  <g transform="translate(120 120) translate(0 880) scale(1 -1)" fill-rule="nonzero">
